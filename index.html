<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <style>
        h1{
            color: red;
        }
    </style> -->
    <!-- head tagına etiket açarak kullanılabilir örnek bu şekild class ve id de bu tarzdır-->
    <link rel="stylesheet" href="style.css" />
    <!--bu ise css dosyası ayrı açılır ve link ile htm dosyasına bağlanır-->

    <style>
      .yaziOzekllik {
        color: blue;
      }
      #yaziRengi {
        color: #d327d3;
        width: 100px;
        height: 200px;
      }
      /* css te bu şekilde yorum satırı kullanabiliriz */

      .kutu1 {
        height: 100px;
        width: 100px;
        background-color: blue;
      }

      .kutu {
        background-color: blueviolet;
        border: 7px inset red;
        width: 50%;
        height: 100px;
        border-radius: 5px;
        padding: 10px;
        margin: 10px;
        margin-left: 50px;
      }

      .kutu2 {
        background-color: aqua;
        width: 50%;
        height: 50%;
      }

      .kutu4 {
        background-color: #d327d3;
        width: 250px;
        height: 250px;
        display: inline-block;
        margin-right: 10px;
      }

      .kutu5 {
        background-color: red;
        width: 50px;
        height: 50px;
        display: inline-block;
      }

      .paragraf {
        color: blue;
        background-color: rgb(230, 7, 7);
        text-align: left;
        font-weight: bold;
        font-family: "Times New Roman", Times, serif;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-decoration: line-through;
        word-spacing: 10px;
      }

      /* * {
        color: red;
        background-color: red;
        width: 50px;
      } */
    </style>
  </head>
  <body>
    <!--3 çeşit css koda ekleme şekli var bunlar
    etkiet kullanarak
    style etiketleri kullanarak
    harici bir css dosyası ile -->

    <h1 style="color: aqua"></h1>

    <!-- mesela burda etiket kullanarak yapılmıştır -->

    <h2 class="yaziOzekllik">
      Lorem ipsum, dolor sit amet consectetur adipisicing elit. Doloremque,
      obcaecati.
    </h2>
    <h2 id="yaziRengi">deneme</h2>
    <h2>deneme123</h2>
    <h2>deneme 123456</h2>
    <!-- id birkez kullanmak öenmli çünkü ilerde js de id ile çekebiliriz yorumu heryerde kullanırsak hepsi gelir-->

    <div class="kutu1"></div>

    <div class="kutu">
      <div class="kutu2"></div>
    </div>

    <div class="kutu2"></div>

    <div class="kutu4">
      <p class="paragraf">Lorem ipsum dolor sit amet.</p>
    </div>

    <div class="kutu5"></div>
  </body>
</html>
